<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>X 粉丝数显示</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <h1>X 粉丝数显示</h1>
      <label class="toggle-row" for="enabled">
        <input id="enabled" type="checkbox">
        <span>显示发帖人粉丝数</span>
      </label>
      <p id="status" class="status" role="status">正在读取状态…</p>
      <p class="hint">仅在 X 首页的“为你推荐”和“正在关注”时间线生效。</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
